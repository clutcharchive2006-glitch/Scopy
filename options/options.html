<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SnipCopy Settings</title>
  <style>
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 32px auto;
      color: #111827;
      padding: 0 16px;
    }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    textarea {
      width: 100%;
      min-height: 100px;
      box-sizing: border-box;
      font: 13px/1.4 ui-monospace, SFMono-Regular, monospace;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    button {
      margin-top: 16px;
      cursor: pointer;
      border: none;
      background: #4688f1;
      color: #fff;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
    }
    #status { margin-left: 12px; color: #6b7280; font-size: 13px; }
    p.hint { color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <h1>SnipCopy Settings</h1>

  <div class="row">
    <input type="checkbox" id="enabled" />
    <label for="enabled" style="margin:0;">Automatically restore copy/selection on pages that block it</label>
  </div>
  <p class="hint">Turn this off if you'd rather enable it site by site, or if it interferes with a
    site's normal behavior. The snip-and-scan tool (keyboard shortcut or toolbar icon) always
    works regardless of this setting.</p>

  <label for="disabledSites">Sites to leave alone (one hostname per line, e.g. example.com)</label>
  <textarea id="disabledSites" placeholder="example.com&#10;another-site.com"></textarea>

  <div>
    <button id="save">Save</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>

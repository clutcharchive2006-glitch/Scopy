<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SnipCopy OCR worker (offscreen, not shown to the user)</title>
</head>
<body>
  <!--
    This page is never visible to the user — Chrome runs offscreen
    documents with no window. It exists purely so we have a place with
    full Canvas/Image/Worker access to crop the screenshot and run OCR,
    since offscreen documents can't use most chrome.* APIs but CAN use
    ordinary Web APIs. See rule "Offscreen documents have NO access to
    most chrome.* APIs" in the chrome-extensions skill.

    offscreen.js here is a BUILT file (bundled by esbuild from
    offscreen.src.js via `npm run build`) — it's the one thing in this
    extension that isn't hand-written directly, because it needs to pull
    in the ppu-paddle-ocr/onnxruntime-web npm packages, which browsers
    can't resolve without a bundler. Don't hand-edit offscreen.js; edit
    offscreen.src.js and rebuild. It's loaded as a module because the
    build output is ESM.
  -->
  <script type="module" src="offscreen.js"></script>
</body>
</html>
